# One-off: creates the part folders (with start-here READMEs) and moves the
# backend and AI guides out of docs/. Run once from Actions, then delete this file.
name: Organize folders

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create part folders and move guides
        shell: bash
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          cat > /tmp/organize.py <<'PY'
          import json
          PARTS = json.loads(r'''{"forsa": {"mobile": "# Mobile app (Flutter): the customer app\n\nCustomers use this app to find nearby shops and technicians, order products, book services, follow their orders, and chat with the Egyptian Arabic assistant.\n\n**بالعربي:** ده تطبيق العميل. منه بيدوّر على المحلات والفنيين القريبين، يطلب منتجات، يحجز خدمات، يتابع طلباته، ويكلّم المساعد بالعامية.\n\n## Start here (first time only)\n\nIssue [#4](https://github.com/hicsis-grad-2027/forsa-sai/issues/4) creates the app inside this folder:\n\n```bash\ncd mobile\nflutter create --org com.forsasai --project-name forsa_sai .\nflutter run\n```\n\n`flutter create .` adds the project around this README. If it replaces this file, get it back with `git checkout mobile/README.md`.\n\n## Every day\n\n```bash\nflutter pub get        # after pulling new changes\nflutter run            # run on the emulator or your phone\ndart format .          # CI fails if the code isn't formatted\nflutter analyze        # CI fails on analyzer errors\nflutter test           # run the tests\n```\n\nThese are the same checks CI runs on your pull request, so run them before you push.\n\n## Rules for this folder\n\n- **Arabic right-to-left from the first screen.** Add `flutter_localizations` and set the app locale to Arabic.\n- **No hardcoded API address.** Pass it at run time, e.g. `flutter run --dart-define=API_URL=http://10.0.2.2:8000`.\n- **Keep the layers apart.** Screens (widgets) draw. State/controllers decide. Services call the API. Never call the API from inside a widget.\n- **Every screen has three states:** loading, empty, and error (with a clear Arabic message).\n- **Firebase files stay out of git.** `google-services.json` is in `.gitignore`. Get it from the Firebase console or your team lead.\n\nSuggested folder layout once the app grows:\n\n```\nmobile/lib/\n├── main.dart\n├── config/        # API address, constants\n├── models/        # Shop, Product, Order...\n├── services/      # API calls, Firebase\n├── state/         # controllers / providers\n└── screens/       # one folder per screen\n```\n\n## Your issues\n\n[Open mobile issues](https://github.com/hicsis-grad-2027/forsa-sai/issues?q=is%3Aopen+label%3Aarea%3Amobile). Start with #4, then #8 (sign in) and #11 (nearby).\n\n## Read also\n\n- [How we work](../docs/01-workflow.md): issue → branch → pull request\n- [Engineering principles](../backend/PRINCIPLES.md): written for the backend, but the same five habits apply to app code\n", "web": "# Web dashboard: the merchant side\n\nMerchants use this website to manage their products, stock, services and time slots, confirm orders and bookings, and see their sales.\n\n**بالعربي:** ده موقع التاجر. منه بيدير المنتجات والمخزون والخدمات والمواعيد، ويأكّد الطلبات والحجوزات، ويشوف مبيعاته.\n\n## Start here (first time only)\n\nIssue [#5](https://github.com/hicsis-grad-2027/forsa-sai/issues/5) creates the site in this folder, with the web framework chosen in issue #1 (`docs/adr/0002-tech-stack.md`). For example, with React:\n\n```bash\ncd web\nnpm create vite@latest . -- --template react-ts\nnpm install\nnpm run dev\n```\n\nIf the tool replaces this README, get it back with `git checkout web/README.md`.\n\n## Every day\n\n```bash\nnpm install        # after pulling new changes\nnpm run dev        # run locally\nnpm run lint       # CI runs this\nnpm run build      # CI runs this\nnpm test           # CI runs this if a \"test\" script exists\n```\n\nCommit `package-lock.json`. CI uses it to install the exact same versions.\n\n## Rules for this folder\n\n- **Arabic right-to-left.** Put `dir=\"rtl\"` and `lang=\"ar\"` on the page, and check every page on a laptop and on a phone-sized screen.\n- **No hardcoded API address.** Read it from an environment variable (e.g. `VITE_API_URL` in a `.env` file that is not committed).\n- **Keep components simple.** Pages and components show data. API calls live in one `api/` folder. Business rules live in the backend.\n- **The backend is the real guard.** Hiding a button is not security: the backend must refuse a merchant who edits another shop.\n- **Forms keep what the user typed** when saving fails, and show errors next to the field.\n\n## Your issues\n\n[Open web issues](https://github.com/hicsis-grad-2027/forsa-sai/issues?q=is%3Aopen+label%3Aarea%3Aweb). Start with #5, then #15 (products and stock) and #21 (orders).\n\n## Read also\n\n- [How we work](../docs/01-workflow.md): issue → branch → pull request\n- [Engineering principles](../backend/PRINCIPLES.md): the same five habits apply to web code\n", "backend": "# Backend: API, database and demo data\n\nThe backend is the single source of truth. Both the mobile app and the web dashboard talk only to it. It checks the Firebase login, stores shops, products, orders and bookings, and sends notifications.\n\n**بالعربي:** الباك إند هو المرجع الوحيد. التطبيق والداشبورد بيكلّموه هو بس. هو اللي بيتأكد من الدخول، ويخزّن المحلات والطلبات والحجوزات، ويبعت الإشعارات.\n\n## Read this first\n\n[PRINCIPLES.md](PRINCIPLES.md): five habits that make backend code safe and easy to change. Reviewers use them on every pull request.\n\n## Start here (first time only)\n\nIssue [#6](https://github.com/hicsis-grad-2027/forsa-sai/issues/6) creates the backend here, with the language and database chosen in issue #1 (`docs/adr/0002-tech-stack.md`). For example, with Python and FastAPI:\n\n```bash\ncd backend\nuv init --app .\nuv add fastapi uvicorn pydantic-settings\nuv add --dev pytest ruff httpx\n# create app/main.py with a /health route (see the layout below), then:\nuv run uvicorn app.main:app --reload\n```\n\nThe starter is done when it has:\n\n- `GET /health`\n- settings read from `.env` (and every setting listed in the root `.env.example`)\n- `docker compose up` starting the backend and the database\n- a seed script that fills the database with fake shops around 6th of October\n- at least one test, with CI green\n\n## Every day\n\n```bash\ndocker compose up        # start backend + database\nuv run pytest            # run the tests\nuv run ruff check .      # CI runs this\nuv run ruff format .     # CI fails if code isn't formatted\n```\n\n(Use the equivalent commands if the team chose Node.js. CI detects `pyproject.toml` or `package.json` automatically.)\n\n## Suggested layout\n\n```\nbackend/\n├── app/\n│   ├── main.py          # creates the app, adds the routes\n│   ├── settings.py      # reads .env, fails at startup if something is missing\n│   ├── routes/          # HTTP only: read the request, call a service, return a response\n│   ├── services/        # the business rules (cart, orders, bookings, status)\n│   ├── repositories/    # the only code that talks to the database\n│   └── models/          # request/response shapes and enums\n├── scripts/seed.py      # demo data; running it twice gives the same result\n├── tests/\n└── Dockerfile\n```\n\n## Rules for this folder\n\n- **Never trust the app.** Check the Firebase token on every request. Prices, totals and roles come from the database, never from the request.\n- **Validate input at the door.** Bad input gets a clear `422`, never a `500`.\n- **Assume everything runs twice.** Double taps and retries must not create two orders or two bookings.\n- **No secrets in git.** Keys go in `.env`; the Firebase service-account file stays out of the repo.\n\n## Your issues\n\n[Open backend issues](https://github.com/hicsis-grad-2027/forsa-sai/issues?q=is%3Aopen+label%3Aarea%3Abackend). Start with #6, then #7 (login check) and #10 (nearby).\n", "ai": "# AI: the Egyptian Arabic assistant\n\nThe assistant reads a message like \"عايز سباك قريب مني النهارده ومش غالي\", turns it into search filters, and the normal search finds real shops and technicians. It never invents results.\n\n**بالعربي:** المساعد بياخد رسالة المستخدم بالعامية، ويحوّلها لفلاتر بحث، والبحث العادي هو اللي بيجيب المحلات والفنيين الحقيقيين. عمره ما يألّف نتايج.\n\n## Start here\n\nIssue [#26](https://github.com/hicsis-grad-2027/forsa-sai/issues/26) builds it. The first two days are for trying two approaches and writing down the choice in `docs/adr/`.\n\n```\nuser message  →  AI fills the filters  →  normal search API (#12)  →  real results\n```\n\nKeep the work in this folder:\n\n```\nai/\n├── examples.md      # 30 Egyptian Arabic messages + the filters each should give\n├── prompts/         # the prompt(s), versioned like code\n├── evaluate.py      # runs the 30 examples and prints how many pass\n└── report.md        # the latest results: passed, failed, average time\n```\n\nThe `POST /chat` endpoint itself lives in the backend and calls this code.\n\n## Rules for this folder\n\n- **API keys stay on the backend.** Never put an LLM key in the mobile app or in git.\n- **Real results only.** The model fills filters; the search API returns shops. If the model mentions a shop that isn't in the results, that's a bug.\n- **Measure, don't guess.** Every change to the prompt runs `evaluate.py`, and the pass count goes in the pull request.\n- **Unclear message? Ask one question back** instead of guessing.\n\n## Read also\n\n[AI-CONCEPTS.md](AI-CONCEPTS.md) explains how AI work is done in real products. It's mostly about training your own model, which this project doesn't need. The parts that apply here are **\"Measure before you believe\"** and **\"Be honest about what the model can do\"**.\n\n## Your issues\n\n[Open AI issues](https://github.com/hicsis-grad-2027/forsa-sai/issues?q=is%3Aopen+label%3Aarea%3Aml): #26 (assistant) and #27 (chat screen, with the mobile team).\n"}, "template": {"frontend": "# Frontend: the part users see\n\nThe mobile app or website your users open. If the project has both (e.g. a customer app and an admin website), rename this folder to `mobile/` and add a `web/` folder, each with its own README like this one.\n\n**بالعربي:** ده الجزء اللي المستخدم بيشوفه: تطبيق موبايل أو موقع. لو المشروع فيه الاتنين، سمّوا الفولدر ده `mobile/` واعملوا فولدر `web/` جنبه.\n\n## Start here (first time only)\n\nCreate the project inside this folder. Pick the one that fits:\n\n```bash\ncd frontend\n\n# Flutter app\nflutter create --org com.yourteam --project-name your_app .\n\n# or a web app (React example)\nnpm create vite@latest . -- --template react-ts\n```\n\nIf the tool replaces this README, get it back with `git checkout frontend/README.md`.\n\n## Every day\n\n| Flutter | Web |\n|---|---|\n| `flutter pub get` | `npm install` |\n| `flutter run` | `npm run dev` |\n| `dart format .` | `npm run lint` |\n| `flutter analyze` | `npm run build` |\n| `flutter test` | `npm test` |\n\nThese are the same checks CI runs on your pull request (it finds `pubspec.yaml` or `package.json` by itself), so run them before you push.\n\n## Rules for this folder\n\n- **No hardcoded API address.** Read it from config (`--dart-define` in Flutter, an env variable on the web).\n- **Keep the layers apart.** Screens/components show data. One `services/` (or `api/`) folder calls the backend. Business rules live in the backend.\n- **Every screen has three states:** loading, empty, and error with a clear message.\n- **If the app is in Arabic,** set right-to-left from the first screen, not at the end.\n- **No keys in the app or in git.** Anything secret belongs on the backend.\n\n## Read also\n\n- [How we work](../docs/01-workflow.md): issue → branch → pull request\n- [Engineering principles](../backend/PRINCIPLES.md): written for the backend, but the same five habits apply here\n", "backend": "# Backend: API and database\n\nThe backend is the single source of truth. The app and the website talk only to it. It checks who the user is, stores the data, and holds the business rules.\n\n**بالعربي:** الباك إند هو المرجع الوحيد. التطبيق والموقع بيكلّموه هو بس. هو اللي بيعرف المستخدم مين، ويخزّن الداتا، وفيه قواعد الشغل.\n\n## Read this first\n\n[PRINCIPLES.md](PRINCIPLES.md): five habits that make backend code safe and easy to change. Reviewers use them on every pull request.\n\n## Start here (first time only)\n\nCreate the backend in this folder with the language your team chose (write the choice in `docs/adr/`). For example, with Python and FastAPI:\n\n```bash\ncd backend\nuv init --app .\nuv add fastapi uvicorn pydantic-settings\nuv add --dev pytest ruff httpx\n# create app/main.py with a /health route (see the layout below), then:\nuv run uvicorn app.main:app --reload\n```\n\nThe starter is done when it has:\n\n- `GET /health`\n- settings read from `.env` (and every setting listed in the root `.env.example`)\n- `docker compose up` starting the backend and the database\n- a seed script that fills the database with demo data\n- at least one test, with CI green\n\n## Every day\n\n```bash\ndocker compose up        # start backend + database\nuv run pytest            # run the tests\nuv run ruff check .      # CI runs this\nuv run ruff format .     # CI fails if code isn't formatted\n```\n\n(Use the equivalent commands for Node.js. CI detects `pyproject.toml`, `requirements.txt` or `package.json` automatically.)\n\n## Suggested layout\n\n```\nbackend/\n├── app/\n│   ├── main.py          # creates the app, adds the routes\n│   ├── settings.py      # reads .env, fails at startup if something is missing\n│   ├── routes/          # HTTP only: read the request, call a service, return a response\n│   ├── services/        # the business rules\n│   ├── repositories/    # the only code that talks to the database\n│   └── models/          # request/response shapes and enums\n├── scripts/seed.py      # demo data; running it twice gives the same result\n├── tests/\n└── Dockerfile\n```\n\n## Rules for this folder\n\n- **Never trust the client.** Check the login on every request. Prices, totals and roles come from the database, never from the request.\n- **Validate input at the door.** Bad input gets a clear `422`, never a `500`.\n- **Assume everything runs twice.** Retries and double clicks must not create duplicates.\n- **No secrets in git.** Keys go in `.env`, which is never committed.\n", "ai": "# AI: models, prompts and evaluation\n\nOnly if the project has an AI part. If it doesn't, delete this folder in your first pull request.\n\n**بالعربي:** الفولدر ده للمشاريع اللي فيها جزء AI بس. لو مشروعكم مفيهوش، امسحوه في أول pull request.\n\n## Read this first\n\n[AI-CONCEPTS.md](AI-CONCEPTS.md): how AI work is done in real products. Lineage, model versions, data leakage, and measuring before believing.\n\n## Start here\n\nPick the kind of AI work first, because the folder looks different:\n\n**You train your own model** (e.g. a classifier or a risk model):\n\n```\nai/\n├── data/README.md     # where the data comes from and how to download it (data files are NOT in git)\n├── train.py           # training is a script, not a notebook\n├── evaluate.py        # metrics vs. a simple baseline\n├── notebooks/         # exploration only\n└── model-card.md      # what it predicts, the data, the metrics, known limits\n```\n\n**You use an LLM API** (e.g. a chatbot or an assistant):\n\n```\nai/\n├── examples.md        # 30+ example inputs and the output each should give\n├── prompts/           # prompts, versioned like code\n├── evaluate.py        # runs the examples and prints how many pass\n└── report.md          # the latest results\n```\n\n## Rules for this folder\n\n- **No model files or datasets in git.** CI blocks `.pkl`, `.pt`, `.h5`, `.onnx` and files over 5 MB. Attach models to a GitHub Release instead.\n- **No API keys in git or in the app.** The backend calls the AI; keys live in `.env`.\n- **Always compare with a baseline**, and put the numbers in the pull request.\n- **Split data the honest way.** Time-series → train on the past, test on the future. Map/location data → split by region.\n"}}''')
          """Organize a team repo into part folders (frontend/backend/ai) with start-here READMEs.

          Moves docs/04 → backend/PRINCIPLES.md and docs/05 → ai/AI-CONCEPTS.md, rewrites every
          Markdown link that pointed at them, and updates the README structure block, docs/README.md
          and CODEOWNERS. Safe to run twice: moved files and existing READMEs are left alone.

          Usage: python restructure.py <repo-root> <forsa|template>
          PARTS (dict variant -> {folder: readme_text}) is injected by the caller.
          """

          import os
          import re
          import sys
          from pathlib import Path

          MOVES = {
              "docs/04-engineering-principles.md": "backend/PRINCIPLES.md",
              "docs/05-ai-and-mlops-concepts.md": "ai/AI-CONCEPTS.md",
          }

          FOLDER_BLURB = {
              "mobile": "Flutter customer app",
              "web": "merchant web dashboard",
              "frontend": "the app or website users see",
              "backend": "API, database, demo data",
              "ai": "AI part (delete if the project has none)",
          }
          FOLDER_BLURB_FORSA_AI = "Egyptian Arabic assistant"


          def structure_block(variant, folders):
              width = max(len(f) + 1 for f in folders + ["docs", ".github"]) + 2
              lines = ["."]
              for f in folders:
                  blurb = FOLDER_BLURB_FORSA_AI if (variant == "forsa" and f == "ai") else FOLDER_BLURB[f]
                  lines.append(f"├── {(f + '/').ljust(width)}# {blurb}: start with its README")
              lines.append(f"├── {'docs/'.ljust(width)}# team-wide guides: workflow, done, review, architecture, ADRs")
              lines.append(f"└── {'.github/'.ljust(width)}# CI, templates, CODEOWNERS")
              return "\n".join(lines)


          def docs_readme(folders):
              rows = "\n".join(f"| [`{f}/`](../{f}/README.md) | {FOLDER_BLURB[f] if f != 'ai' else 'AI part'} |" for f in folders)
              return f"""# Docs

          Team-wide guides live here. Each part of the code has its own "start here" README inside its folder.

          | Guide | Read when |
          |---|---|
          | [00 — Quick start (Arabic)](00-quickstart-ar.md) | Day 1 |
          | [01 — Workflow](01-workflow.md) | Before your first PR |
          | [02 — Definition of Done](02-definition-of-done.md) | Before every PR and milestone |
          | [03 — Code review](03-code-review.md) | Before your first review |
          | [Architecture](architecture.md) | Owned by the team, kept current |
          | [ADRs](adr/) | When making a significant decision |

          | Part | What it is |
          |---|---|
          {rows}

          Engineering principles are in [`backend/PRINCIPLES.md`](../backend/PRINCIPLES.md); AI concepts are in [`ai/AI-CONCEPTS.md`](../ai/AI-CONCEPTS.md).
          """


          def rewrite_links(root):
              """Point every mention of a moved file at its new place, relative to the file that mentions it."""
              changed = []
              for md in root.rglob("*.md"):
                  if ".git" in md.parts:
                      continue
                  text = md.read_text(encoding="utf-8")
                  new = text
                  for old, dest in MOVES.items():
                      name = re.escape(Path(old).name)
                      rel = os.path.relpath(root / dest, md.parent).replace(os.sep, "/")
                      new = re.sub(rf"(?:\.\./)*(?:docs/)?{name}", rel, new)
                  # Readable link text: "[04](…)" → named links, "[../x/Y.md](…)" → "[x/Y.md](…)".
                  new = re.sub(r"\[04\]\(", "[the engineering principles](", new)
                  new = re.sub(r"\[05\]\(", "[the AI concepts](", new)
                  new = re.sub(r"\[(?:\.\./)+((?:backend|ai)/[A-Z-]+\.md)\]\(", r"[\1](", new)
                  if md.name == "CONTRIBUTING.md" and "README in the folder you work in" not in new:
                      new = re.sub(r"(\n6\. \[ai/AI-CONCEPTS\.md\][^\n]*)",
                                   r"\1\n7. The README in the folder you work in (e.g. `backend/README.md`): how to start and run that part",
                                   new)
                  if new != text:
                      md.write_text(new, encoding="utf-8")
                      changed.append(str(md.relative_to(root)))
              return changed


          def main(root, variant, parts):
              root = Path(root)
              folders = list(parts[variant])

              for folder, readme in parts[variant].items():
                  target = root / folder / "README.md"
                  target.parent.mkdir(exist_ok=True)
                  if not target.exists():
                      target.write_text(readme, encoding="utf-8")

              for old, dest in MOVES.items():
                  if (root / old).exists() and not (root / dest).exists():
                      (root / old).rename(root / dest)

              changed = rewrite_links(root)

              readme = root / "README.md"
              text = readme.read_text(encoding="utf-8")
              text = re.sub(r"(## Project structure\n\n```\n).*?(\n```)", lambda m: m[1] + structure_block(variant, folders) + m[2],
                            text, count=1, flags=re.S)
              readme.write_text(text, encoding="utf-8")

              (root / "docs/README.md").write_text(docs_readme(folders), encoding="utf-8")

              owners = root / ".github/CODEOWNERS"
              if owners.exists():
                  owners.write_text(owners.read_text(encoding="utf-8").replace("# /ml/   ", "# /ai/   "), encoding="utf-8")

              print("folders:", folders)
              print("links rewritten in:", changed)


          if __name__ == "__main__":
              main(sys.argv[1], sys.argv[2], PARTS)  # noqa: F821  (PARTS injected)

          PY
          variant=template
          if [ "$REPO_NAME" = "forsa-sai" ]; then variant=forsa; fi
          python3 /tmp/organize.py . "$variant"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to change."
          else
            git commit -m "docs: organize repo into part folders with start-here guides"
            git push
          fi
